<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Programmer's Apartment</title>
    <style>
        body { margin: 0; background-color: #0a0a1a; color: white; font-family: 'Courier New', Courier, monospace; overflow: hidden; }
        canvas { display: block; }
        #tvVideo {
            position: absolute;
            width: 2px;
            height: 2px;
            opacity: 0;
            pointer-events: none;
            left: -9999px;
        }
        #info, #exitTooltip {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            z-index: 100;
            color: rgba(255, 255, 255, 0.7);
        }
        #interactionTooltip {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(10, 10, 26, 0.85);
            border: 1px solid #00bfff;
            padding: 15px 25px;
            border-radius: 5px;
            font-size: 18px;
            color: #00bfff;
            text-shadow: 0 0 5px #00bfff;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease-in-out;
            box-shadow: 0 0 10px rgba(0, 191, 255, 0.2);
        }
        #tvControls {
            position: absolute;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(10, 10, 26, 0.85);
            border: 1px solid #00bfff;
            padding: 10px 15px;
            border-radius: 8px;
            z-index: 101;
            box-shadow: 0 0 10px rgba(0, 191, 255, 0.2);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            gap: 15px;
        }
        #tvControls button {
            background-color: transparent;
            border: 1px solid #00bfff;
            color: #00bfff;
            cursor: pointer;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s, color 0.3s, box-shadow 0.3s;
        }
        #tvControls button:hover {
            background-color: #00bfff;
            color: #101018;
            box-shadow: 0 0 10px #00bfff;
        }
        #tvControls button svg {
            width: 24px;
            height: 24px;
        }
        #fadeOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0a0a1a;
            opacity: 0;
            pointer-events: none;
            z-index: 999;
            transition: opacity 0.5s ease-in-out;
        }
        #websiteContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            z-index: 102;
        }
        #websiteFrame {
            position: absolute;
            border: 2px solid #00bfff;
            box-shadow: 0 0 20px #00bfff;
            background-color: #000;
            /* keep the iframe's logical size at 1280x695 and scale via transform to fit the monitor */
            width: 1280px;
            height: 695px;
            transform-origin: center center;
            will-change: transform, left, top;
        }
        #exitTooltip {
            top: auto;
            bottom: 20px;
            color: #fff;
            background-color: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
        #splashScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0a0a1a;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            transition: opacity 0.8s ease-out;
        }
        #splashScreen h1 {
            color: #00bfff;
            font-size: 2.5em;
            text-shadow: 0 0 10px #00bfff;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        #loadingBarContainer {
            width: 300px;
            height: 10px;
            border: 1px solid #00bfff;
            border-radius: 5px;
            overflow: hidden;
        }
        #loadingBar {
            width: 0%;
            height: 100%;
            background-color: #00bfff;
            transition: width 0.3s ease-out;
        }
    </style>
</head>
<body>
    <!-- Splash Screen -->
    <div id="splashScreen">
        <h1>Welcome to My Virtual Space</h1>
        <div id="loadingBarContainer">
            <div id="loadingBar"></div>
        </div>
    </div>
    
    <!-- Hidden video element for the TV texture -->
    <video id="tvVideo" autoplay loop muted playsinline crossorigin="anonymous">
        <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <!-- UI Elements -->
    <div id="info" style="display: none;">Click to Start, then W, A, S, D to Move & Mouse to Look  (refresh if page is blank)</div>
    <div id="interactionTooltip">Press [Enter] to Interact</div>
    <div id="fadeOverlay"></div>
    <div id="tvControls">
        <button id="tvPrev" title="Previous Video">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"></path></svg>
        </button>
        <button id="tvPlayPause" title="Play/Pause">
            <svg id="tvIconPlay" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" style="display: none;"><path d="M8 5v14l11-7z"></path></svg>
            <svg id="tvIconPause" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path></svg>
        </button>
        <button id="tvMute" title="Mute/Unmute">
            <svg id="tvIconUnmute" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"></path></svg>
            <svg id="tvIconMute" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" style="display: none;"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"></path></svg>
        </button>
        <button id="tvNext" title="Next Video">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zm-4.5 6-8.5 6V6z"></path></svg>
        </button>
    </div>
    <div id="websiteContainer">
        <iframe id="websiteFrame" src="about:blank"></iframe>
        <div id="exitTooltip">Click outside the screen and Press [Esc] to Exit</div>
    </div>


    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/",
                 "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/index.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { FontLoader } from 'three/addons/loaders/FontLoader.js';
        import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
        import { gsap } from 'gsap';

        // --- SCENE GLOBALS ---
        let scene, camera, renderer, composer, clock;
        let cityCanvas, cityCtx, cityTexture, bgCanvas, bgCtx, snowflakes = [];
        let tvVideoElement, tvVideoTexture;
        let tvLoadingCanvas, tvLoadingCtx, tvLoadingTexture, tvLoadingMesh;
        let tvLoadingActive = true;
        const TV_LOADING_FADE_SPEED = 0.03;

        // --- STATE MANAGEMENT ---
        let isTeleporting = false;
        let isNearTV = false;
        let isNearPC = false;
        let isUsingPC = false;
        let isCameraAnimating = false;

        // --- THIRD-PERSON CONTROLS AND PHYSICS VARS ---
        let robot;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let playerVelocity = new THREE.Vector3();
        const playerSpeed = 8.0;
        const robotHeight = 2.0;
        const gravity = 30.0;
        let playerOnFloor = false;
        let colliders = [];
        let interactionTooltipElement, fadeOverlayElement, tvControlsElement, websiteContainer, exitTooltip, websiteFrame, infoElement;
        let floor, centerMonitor;

        // --- TV STATE ---
        const tvPlaylist = [
            'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4', 
            'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4', 
            'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4',
            './videos/BrementownMusiciansUBIwerksComiColor.mp4',
            './videos/PopeyeAliBaba_512kb.mp4',
            './videos/TheCrystalBrawl_512kb.mp4'
        ];
        
        let tvPlaylistIndex = 0;

        // --- ORBITAL CAMERA VARS ---
        let cameraTarget = new THREE.Object3D();
        let cameraDistance = 8.0;
        let cameraTheta = Math.PI; // Horizontal angle
        let cameraPhi = Math.PI / 4; // Vertical angle

        // --- CONSTANTS ---
        const DESK_SURFACE_Y = 3.25;
        const NEON_BLUE = 0x00bfff;
        const NEON_PINK = 0xff00ff;
        const NEON_CYAN = 0x00ffff;
        const WARM_WHITE = 0xfff5e1;
        const WALL_HEIGHT = 10;
        const ROOM_WIDTH = 15;
        const ROOM_DEPTH = 30;

        // PC view (zoom) configuration - adjust these:
        const PC_VIEW_DISTANCE = 2.7;   // meters in front of the monitor; lower -> closer zoom
        const PC_VIEW_DURATION = 1.5;   // seconds for the zoom animation
        const PC_VIEW_EASE = "power2.inOut";
        
        // --- MATERIALS ---
        const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x2e2e48, roughness: 0.9 });
        const darkMaterial = new THREE.MeshStandardMaterial({ color: 0x181818, roughness: 0.4 });
        const deskMaterial = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.8 });
        
        const darkPartMaterial = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3 });
        const accentGlowMaterial = new THREE.MeshStandardMaterial({ color: NEON_CYAN, emissive: NEON_CYAN, emissiveIntensity: 10 });
        // --- HELPER FUNCTIONS ---

        function createArm() {
            const armGroup = new THREE.Group();
            
            const upperArm = new THREE.Mesh(new THREE.CapsuleGeometry(0.1, 0.1, 4, 8), darkPartMaterial);
            upperArm.position.y = -0.35;

            const glowDetail1 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.2, 0.08), accentGlowMaterial);
            glowDetail1.position.y = -0.25;
            glowDetail1.position.z = 0.01;
            upperArm.add(glowDetail1);

            const lowerArm = new THREE.Mesh(new THREE.CapsuleGeometry(0.08, 0.2, 4, 8), darkPartMaterial);
            lowerArm.position.y = -0.9;

            const glowDetail2 = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.2, 0.06), accentGlowMaterial);
            glowDetail2.position.y = -0.25;
            glowDetail2.position.z = 0.01;
            lowerArm.add(glowDetail2);
    
            // Hand
            const hand = new THREE.Group();
            const palm = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.1), darkPartMaterial);
            const finger1 = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.15, 0.04), darkPartMaterial);
            finger1.position.set(0.06, -0.05, 0);
            finger1.rotation.z = 0.3;
            const finger2 = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.15, 0.04), darkPartMaterial);
            finger2.position.set(-0.06, -0.05, 0);
            finger2.rotation.z = -0.3;
            hand.add(palm, finger1, finger2);
            hand.position.y = -1.4;
    
            armGroup.add(upperArm, lowerArm, hand);
            return armGroup;
        }

        function createRobot() {
            const robotGroup = new THREE.Group();
            const bodyMaterial = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.3 });
            const accentMaterial = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.5 });
            const eyeMaterial = new THREE.MeshStandardMaterial({ color: NEON_CYAN, emissive: NEON_CYAN, emissiveIntensity: 10 });
            const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.6, 0.8, 4, 16), bodyMaterial);
            body.position.y = 1.1;
            robotGroup.add(body);
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 32, 16), bodyMaterial);
            head.position.y = 2.2;
            robotGroup.add(head);
            const eye = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 8), eyeMaterial);
            eye.position.set(0, 2.3, 0.3);
            robotGroup.add(eye);
            const antennaStem = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.5, 8), accentMaterial);
            antennaStem.position.y = 2.6;
            robotGroup.add(antennaStem);
            const antennaBall = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), eyeMaterial);
            antennaBall.position.y = 2.85;
            robotGroup.add(antennaBall);
            const wheelGeometry = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
            const wheelL = new THREE.Mesh(wheelGeometry, accentMaterial);
            wheelL.rotation.z = Math.PI / 2;
            wheelL.position.set(0.65, 0.5, 0);
            robotGroup.add(wheelL);
            const wheelR = new THREE.Mesh(wheelGeometry, accentMaterial);
            wheelR.rotation.z = Math.PI / 2;
            wheelR.position.set(-0.65, 0.5, 0);
            robotGroup.add(wheelR);
            // const handGeometry = new THREE.CapsuleGeometry(0.1, 0.7, 4, 8);
            // const handL = new THREE.Mesh(handGeometry, accentMaterial);
            // handL.position.set(0.7, 1.4, 0);
            // robotGroup.add(handL);
            // const handR = new THREE.Mesh(handGeometry, accentMaterial);
            // handR.position.set(-0.7, 1.4, 0);
            // robotGroup.add(handR);

            const armL = createArm();
            armL.position.set(0.6, 2.1, 0);
            armL.rotation.z = 0.2;
            robotGroup.add(armL);
        
            const armR = createArm();
            armR.position.set(-0.6, 2.1, 0);
            armR.rotation.z = -0.2;
            robotGroup.add(armR);

            const collisionBox = new THREE.Mesh(
                new THREE.BoxGeometry(1.2, robotHeight, 1.2),
                new THREE.MeshBasicMaterial({ visible: false, wireframe: true })
            );
            collisionBox.position.y = robotHeight / 2;
            robotGroup.add(collisionBox);
            robotGroup.userData.collisionBox = collisionBox;
            return robotGroup;
        }

        function createDrawerUnit(position) {
            const group = new THREE.Group();
            const casingMaterial = new THREE.MeshStandardMaterial({ color: 0xe0e0e0, roughness: 0.8 });
            const handleMaterial = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const casing = new THREE.Mesh(new THREE.BoxGeometry(2, 3, 2.8), casingMaterial);
            group.add(casing);
            for (let i = 0; i < 3; i++) {
                const drawerFront = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.9, 0.1), casingMaterial);
                drawerFront.position.set(0, 1 - (i * 1), 1.45);
                group.add(drawerFront);
                const handle = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.1, 0.1), handleMaterial);
                handle.position.set(0, 1 - (i * 1), 1.55);
                group.add(handle);
            }
            group.position.copy(position);
            return group;
        }

        function createPlantPot() {
            const group = new THREE.Group();
            const potMaterial = new THREE.MeshStandardMaterial({ color: 0xf0f0f0, roughness: 0.8 });
            const plantMaterial = new THREE.MeshStandardMaterial({ color: 0x4caf50, roughness: 0.6 });
            const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.15, 0.3, 12), potMaterial);
            group.add(pot);
            const foliageGroup = new THREE.Group();
            for (let i = 0; i < 15; i++) {
                const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), plantMaterial);
                const phi = Math.acos(-1 + (2 * i) / 15);
                const theta = Math.sqrt(15 * Math.PI) * phi;
                leaf.position.set(Math.cos(theta) * Math.sin(phi) * 0.2, Math.sin(theta) * Math.sin(phi) * 0.2, Math.cos(phi) * 0.2);
                foliageGroup.add(leaf);
            }
            foliageGroup.position.y = 0.35;
            group.add(foliageGroup);
            group.scale.set(0.8, 0.8, 0.8);
            return group;
        }

        function createKeyboard() {
            const keyboardGroup = new THREE.Group();
            const keyMaterial = new THREE.MeshStandardMaterial({ map: createKeyboardTexture() });
            const bodyMaterial = new THREE.MeshStandardMaterial({color: 0x1a1a1a});
            const body = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.1, 1), bodyMaterial);
            const keys = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 0.9), keyMaterial);
            keys.position.y = 0.051;
            keys.rotation.x = -Math.PI / 2;
            keyboardGroup.add(body, keys);
            return keyboardGroup;
        }

        function createMouse() {
             const mouseMaterial = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.4 });
             const mouse = new THREE.Mesh(new THREE.CapsuleGeometry(0.2, 0.3, 4, 16), mouseMaterial);
             mouse.rotation.x = -Math.PI / 2;
             mouse.scale.set(1, 1, 0.7);
             return mouse;
        }

        function createOfficeChair() {
            const chairGroup = new THREE.Group();
            const seatMaterial = new THREE.MeshStandardMaterial({ color: 0x282828, roughness: 0.6 });
            const baseHub = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.1, 16), darkMaterial);
            baseHub.position.y = 0.25;
            chairGroup.add(baseHub);
            for (let i = 0; i < 5; i++) {
                const angle = (i / 5) * Math.PI * 2;
                const leg = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.1, 0.2), darkMaterial);
                leg.position.set(Math.cos(angle) * 0.5, 0.2, Math.sin(angle) * 0.5);
                leg.rotation.y = -angle;
                chairGroup.add(leg);
                const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.3, 8), darkMaterial);
                wheel.rotation.x = Math.PI / 2;
                wheel.position.set(Math.cos(angle) * 1.1, 0.15, Math.sin(angle) * 1.1);
                chairGroup.add(wheel);
            }
            const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1.5, 16), darkMaterial);
            stem.position.y = 1.0; chairGroup.add(stem);
            const seat = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.3, 1.5), seatMaterial);
            seat.position.y = 1.8; chairGroup.add(seat);
            const backrest = new THREE.Mesh(new THREE.BoxGeometry(1.4, 2.2, 0.2), seatMaterial);
            backrest.position.set(0, 3, 0.7); backrest.rotation.x = -0.1; chairGroup.add(backrest);
            for (let i = -1; i <= 1; i += 2) {
                const armrestGroup = new THREE.Group();
                const vertical = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.7, 0.15), darkMaterial);
                vertical.position.y = 0.35;
                const horizontal = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 1.2), darkMaterial);
                horizontal.position.set(0, 0.7, -0.4);
                armrestGroup.add(vertical, horizontal);
                armrestGroup.position.set(i * 0.8, 1.8, 0);
                chairGroup.add(armrestGroup);
            }
            return chairGroup;
        }

        function createCuteOctopus() {
            const octopusGroup = new THREE.Group();
            const bodyMaterial = new THREE.MeshStandardMaterial({ color: 0x77aaff, roughness: 0.2 });
            const eyeMaterial = new THREE.MeshStandardMaterial({ color: 0x000000 });
            const body = new THREE.Mesh(new THREE.SphereGeometry(0.4, 32, 16), bodyMaterial);
            body.position.y = 0.4; octopusGroup.add(body);
            const eye1 = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 16), eyeMaterial);
            eye1.position.set(0.2, 0.5, 0.3); octopusGroup.add(eye1);
            const eye2 = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 16), eyeMaterial);
            eye2.position.set(-0.2, 0.5, 0.3); octopusGroup.add(eye2);
            for(let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const tentacle = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.04, 0.5, 8), bodyMaterial);
                tentacle.position.set(Math.cos(angle) * 0.3, 0.1, Math.sin(angle) * 0.3);
                tentacle.rotation.x = Math.PI / 2.5;
                tentacle.rotation.z = -angle;
                octopusGroup.add(tentacle);
            }
            return octopusGroup;
        }

        function createSofa() {
            const sofaGroup = new THREE.Group();
            const sofaMaterial = new THREE.MeshStandardMaterial({ color: 0x3a3a4a, roughness: 0.8 });
            const base = new THREE.Mesh(new THREE.BoxGeometry(8, 1.5, 3.5), sofaMaterial);
            base.position.y = 0.75;
            sofaGroup.add(base);
            const back = new THREE.Mesh(new THREE.BoxGeometry(8, 2, 1), sofaMaterial);
            back.position.set(0, 2.5, -1.25);
            sofaGroup.add(back);
            const cushionMaterial = new THREE.MeshStandardMaterial({ color: 0x4a4a5a, roughness: 0.7 });
            for (let i = 0; i < 3; i++) {
                const seatCushion = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.4, 2.8), cushionMaterial);
                seatCushion.position.set(-2.6 + i * 2.6, 1.7, 0.1);
                sofaGroup.add(seatCushion);
            }
            for (let i = 0; i < 2; i++) {
                const armRest = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 3.5), sofaMaterial);
                armRest.position.set(-4.5 + i * 9, 2, 0);
                sofaGroup.add(armRest);
            }
            return sofaGroup;
        }

        function createCoffeeTable() {
            const tableGroup = new THREE.Group();
            const frameMaterial = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5 });
            const topFrame = new THREE.Mesh(new THREE.BoxGeometry(4.5, 0.2, 2.5), frameMaterial);
            topFrame.position.y = 1;
            tableGroup.add(topFrame);
            for (let x = -1; x <= 1; x += 2) {
                for (let z = -1; z <= 1; z += 2) {
                    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1, 0.2), frameMaterial);
                    leg.position.set(x * 2.1, 0.5, z * 1.1);
                    tableGroup.add(leg);
                }
            }
            const glassMaterial = new THREE.MeshStandardMaterial({
                color: 0xeeeeff, transparent: true, opacity: 0.2, roughness: 0.1,
            });

        function createKeyboardTexture() {
            const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 128;
            const ctx = canvas.getContext('2d'); ctx.fillStyle = '#1e1e1e'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#4a4a4a'; ctx.font = '10px sans-serif';
            const keyWidth = 18, keyHeight = 18, keyGap = 4, top_offset = 10, left_offset = 10;
            const rows = ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"];
            for(let r=0; r < rows.length; r++) {
                for (let i = 0; i < rows[r].length; i++) {
                    const x = left_offset + i * (keyWidth + keyGap) + (r * 10); const y = top_offset + r * (keyHeight + keyGap);
                    ctx.fillRect(x, y, keyWidth, keyHeight); ctx.fillStyle = '#dddddd'; ctx.fillText(rows[r][i], x + 5, y + 13); ctx.fillStyle = '#4a4a4a';
                }
            }
            ctx.fillRect(left_offset + 2 * (keyWidth + keyGap) + 20, top_offset + 3 * (keyHeight + keyGap), 120, keyHeight);
            return new THREE.CanvasTexture(canvas);
        }

        function createCodeScreenMaterial() {
            // Use a higher-resolution canvas that matches 1280x695
            const canvas = document.createElement('canvas');
            canvas.width = 1280;
            canvas.height = 800;
            const ctx = canvas.getContext('2d');

            // Scale helper (original code used 512x256 base)
            const scale = canvas.width / 512;

            // Background / UI blocks
            ctx.fillStyle = '#1e1e1e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#252526';
            ctx.fillRect(0, 0, Math.round(80 * scale), canvas.height);
            ctx.fillStyle = '#2d2d2d';
            ctx.fillRect(Math.round(80 * scale), 0, canvas.width - Math.round(80 * scale), Math.round(30 * scale));

            // Header text
            ctx.fillStyle = '#cccccc';
            ctx.font = `${Math.max(12, Math.round(14 * scale))}px sans-serif`;
            ctx.fillText('scene.js', Math.round(95 * scale), Math.round(20 * scale));

            // Example code block (scaled)
            const code = [
                "// ... existing code ...",
                "function animate() {",
                "  requestAnimationFrame(animate);",
                "  updatePlayer(delta);",
                "  composer.render();",
                "}",
                "",
                "init();",
                "animate();"
            ];

            ctx.font = `${Math.max(12, Math.round(16 * scale))}px monospace`;
            for (let i = 0; i < code.length; i++) {
                const y = Math.round((55 + i * 20) * scale);
                ctx.fillStyle = '#858585';
                ctx.fillText((i + 1).toString().padStart(2, ' '), Math.round(90 * scale), y);
                if (code[i].includes('function') || code[i].includes('const')) {
                    ctx.fillStyle = '#569cd6';
                } else if (code[i].startsWith('//')) {
                    ctx.fillStyle = '#6a9955';
                } else {
                    ctx.fillStyle = '#d4d4d4';
                }
                ctx.fillText(code[i], Math.round(130 * scale), y);
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.minFilter = THREE.LinearFilter;
            tex.magFilter = THREE.LinearFilter;

            // Use the same canvas as emissive map for glow
            return new THREE.MeshStandardMaterial({
                map: tex,
                emissive: 0xffffff,
                emissiveMap: tex,
                emissiveIntensity: 0.8,
                toneMapped: false
            });
        }

        function createRugTexture(color1, color2, text, textureLoader) {
            const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d'); ctx.fillStyle = color1; ctx.fillRect(0, 0, 256, 256);
            ctx.font = '8px monospace'; ctx.fillStyle = color2;
            for(let i=0; i < 256; i+=10) {
                for(let j=0; j < 256; j+=10) {
                    ctx.fillText(text(), i, j);
                }
            }
            return new THREE.CanvasTexture(canvas);
        }

                const textMaterial = new THREE.MeshStandardMaterial({color: NEON_CYAN, emissive: NEON_CYAN, emissiveIntensity: 8});
                const textGeo1 = new TextGeometry('SYNTAX', { font, size: 0.8, height: 0.1 });
                const textMesh1 = new THREE.Mesh(textGeo1, textMaterial);
                textMesh1.position.set(-7.4, 8.5, -10.5); textMesh1.rotation.y = Math.PI / 2; scene.add(textMesh1);
                const textGeo2 = new TextGeometry('ERROR', { font, size: 0.8, height: 0.1 });
                const textMesh2 = new THREE.Mesh(textGeo2, textMaterial);
                textMesh2.position.set(-7.4, 7.5, -10); textMesh2.rotation.y = Math.PI / 2; scene.add(textMesh2);
            });

            // --- GET UI ELEMENTS ---
            interactionTooltipElement = document.getElementById('interactionTooltip');
            fadeOverlayElement = document.getElementById('fadeOverlay');
            tvControlsElement = document.getElementById('tvControls');
            websiteContainer = document.getElementById('websiteContainer');
            websiteFrame = document.getElementById('websiteFrame');
            exitTooltip = document.getElementById('exitTooltip');

            // --- TV CONTROL EVENT LISTENERS ---
            const tvPlayPauseBtn = document.getElementById('tvPlayPause');
            const tvMuteBtn = document.getElementById('tvMute');
            const tvNextBtn = document.getElementById('tvNext');
            const tvPrevBtn = document.getElementById('tvPrev');
            const tvIconPlay = document.getElementById('tvIconPlay');
            const tvIconPause = document.getElementById('tvIconPause');
            const tvIconMute = document.getElementById('tvIconMute');
            const tvIconUnmute = document.getElementById('tvIconUnmute');

            const updatePlayPauseButton = () => {
                tvIconPlay.style.display = tvVideoElement.paused ? 'block' : 'none';
                tvIconPause.style.display = tvVideoElement.paused ? 'none' : 'block';
            };
            const updateMuteButton = () => {
                tvIconMute.style.display = tvVideoElement.muted ? 'block' : 'none';
                tvIconUnmute.style.display = tvVideoElement.muted ? 'none' : 'block';
            };
            
            const handleTVButtonClick = (event, action) => {
                event.stopPropagation(); 
                action();
            };

            tvPlayPauseBtn.addEventListener('click', (e) => handleTVButtonClick(e, () => {
                if (tvVideoElement.paused) tvVideoElement.play();
                else tvVideoElement.pause();
            }));
            tvMuteBtn.addEventListener('click', (e) => handleTVButtonClick(e, () => { tvVideoElement.muted = !tvVideoElement.muted; }));
            tvNextBtn.addEventListener('click', (e) => handleTVButtonClick(e, () => playTvIndex(tvPlaylistIndex + 1)));
            tvPrevBtn.addEventListener('click', (e) => handleTVButtonClick(e, () => playTvIndex(tvPlaylistIndex - 1)));
            
            tvVideoElement.addEventListener('play', updatePlayPauseButton);
            tvVideoElement.addEventListener('pause', updatePlayPauseButton);
            tvVideoElement.addEventListener('volumechange', updateMuteButton);

            updatePlayPauseButton();
            updateMuteButton();
            
            // --- GENERAL EVENT LISTENERS ---
            window.addEventListener('resize', onWindowResize, false);
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousemove', onMouseMove, false);
            document.addEventListener('wheel', onMouseWheel, false);
            document.body.addEventListener('click', () => { 
                if (document.pointerLockElement !== document.body && !isUsingPC) {
                    document.body.requestPointerLock(); 
                }
            });
        }

        function onKeyDown(event) {
            if (isCameraAnimating) return;

            if (isUsingPC) {
                if (event.code === 'Escape') {
                    exitPCView();
                }
                return;
            }

            switch (event.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyD': moveRight = true; break;
                case 'Enter':
                    if (interactionTooltipElement.style.opacity === '1') {
                        if (isNearPC) {
                            enterPCView();
                        } else if (isNearTV) {
                            toggleTVControls();
                        } else { 
                            startTeleport();
                        }
                    }
                    break;
            }
        }
        function onKeyUp(event) {
            switch (event.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyD': moveRight = false; break;
            }
        }
        function onMouseMove(event) {
            if (document.pointerLockElement === document.body) {
                cameraTheta -= event.movementX * 0.002;
                cameraPhi -= event.movementY * 0.002;
                cameraPhi = Math.max(0.1, Math.min(Math.PI / 2.2, cameraPhi));
            }
        }
        function onMouseWheel(event) {
            if(isUsingPC) return;
            cameraDistance += event.deltaY * 0.01;
            cameraDistance = Math.max(4, Math.min(15, cameraDistance));
        }

        function toggleTVControls() {
            const isVisible = tvControlsElement.style.display === 'flex';
            if (isVisible) {
                tvControlsElement.style.display = 'none';
                document.body.requestPointerLock();
            } else {
                tvControlsElement.style.display = 'flex';
                document.exitPointerLock();
            }
        }

        function startTeleport() {
            if (isTeleporting) return;
            isTeleporting = true;
            fadeOverlayElement.style.opacity = '1';
            
            setTimeout(() => {
                const isInLivingRoom = robot.position.z > 0;
                if (isInLivingRoom) {
                    robot.position.set(0, 0, -3); 
                    robot.quaternion.setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI); 
                } else {
                    robot.position.set(0, 0, 3);
                    robot.quaternion.setFromAxisAngle(new THREE.Vector3(0, 1, 0), 0);
                }
                
                setTimeout(() => {
                    fadeOverlayElement.style.opacity = '0';
                    setTimeout(() => { isTeleporting = false; }, 500);
                }, 100);
            }, 500);
        }

        function enterPCView() {
            if (isCameraAnimating) return;
            isCameraAnimating = true;
            isUsingPC = true;
            document.exitPointerLock();

            const monitorWorldPos = new THREE.Vector3();
            centerMonitor.getWorldPosition(monitorWorldPos);

            // Compute monitor forward (screen normal) in world space so we move the camera along the screen direction.
            const screenDir = new THREE.Vector3();
            centerMonitor.getWorldDirection(screenDir).normalize();

            // Target camera position: placed PC_VIEW_DISTANCE meters in front of the monitor surface
            const targetPos = monitorWorldPos.clone().add(screenDir.multiplyScalar(PC_VIEW_DISTANCE));

            // Animate camera position
            gsap.to(camera.position, {
                x: targetPos.x,
                y: targetPos.y,
                z: targetPos.z,
                duration: PC_VIEW_DURATION,
                ease: PC_VIEW_EASE,
            });

            // Tween a temporary lookAt target and update iframe while animating so the embedded page tracks the camera move.
            const tempTarget = new THREE.Vector3();
            gsap.to(tempTarget, {
                x: monitorWorldPos.x,
                y: monitorWorldPos.y,
                z: monitorWorldPos.z,
                duration: PC_VIEW_DURATION,
                ease: PC_VIEW_EASE,
                onUpdate: () => {
                    camera.lookAt(tempTarget);
                    // keep iframe repositioning during zoom for smoother alignment
                    updateIframePosition();
                },
                onComplete: () => {
                    isCameraAnimating = false;
                    updateIframePosition();
                    websiteContainer.style.display = 'block';
                    exitTooltip.style.display = 'block';
                    websiteFrame.src = "https://ashishwaikar.netlify.app"; // igu=1 avoids the redirect consent page
                }
            });
        }
        
        function exitPCView() {
            if (isCameraAnimating) return;
            isCameraAnimating = true;

            // hide UI immediately
            websiteContainer.style.display = 'none';
            exitTooltip.style.display = 'none';
            websiteFrame.src = "about:blank";

            // return control to the normal camera updater smoothly
            gsap.to({}, {
                duration: PC_VIEW_DURATION,
                ease: PC_VIEW_EASE,
                onUpdate: () => updateCamera(),
                onComplete: () => {
                    isCameraAnimating = false;
                    isUsingPC = false;
                }
            });
        }

        function updateIframePosition() {
            if (!centerMonitor) return;

            const screen = centerMonitor;
            screen.updateWorldMatrix(true, false);
            const box = new THREE.Box3().setFromObject(screen);

            const corners = [
                new THREE.Vector3(box.min.x, box.min.y, box.max.z), // Bottom-left
                new THREE.Vector3(box.max.x, box.max.y, box.max.z)  // Top-right
            ];

            const screenCorners = corners.map(corner => {
                const vector = corner.project(camera);
                return {
                    x: (vector.x + 1) / 2 * window.innerWidth,
                    y: (-vector.y + 1) / 2 * window.innerHeight
                };
            });

            const [bottomLeft, topRight] = screenCorners;
            const screenPixelWidth = Math.abs(topRight.x - bottomLeft.x);
            const screenPixelHeight = Math.abs(bottomLeft.y - topRight.y);

            // Keep the iframe at an internal resolution of 1280x695 (match CSS)
            const internalWidth = 1280;
            const internalHeight = 695; // <-- fix: was 795

            // Compute scale to fit the monitor rectangle (allow upscaling)
            const scale = Math.min(screenPixelWidth / internalWidth, screenPixelHeight / internalHeight);

            const centerX = (bottomLeft.x + topRight.x) / 2;
            const centerY = (bottomLeft.y + topRight.y) / 2;

            websiteFrame.style.width = `${internalWidth}px`;
            websiteFrame.style.height = `${internalHeight}px`;
            websiteFrame.style.left = `${Math.round(centerX)}px`;
            websiteFrame.style.top = `${Math.round(centerY)}px`;
            websiteFrame.style.transform = `translate(-50%, -50%) scale(${scale})`;
            websiteFrame.style.maxWidth = '';
            websiteFrame.style.maxHeight = '';
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            if (isUsingPC) {
                updateIframePosition();
            }
        }

        function handleCollisions(delta, moveVector) {
            const robotCollider = robot.userData.collisionBox;
            robotCollider.updateWorldMatrix(true, false);
            const robotBox = new THREE.Box3().setFromObject(robotCollider);
            if (playerOnFloor) { playerVelocity.y = Math.max(0, playerVelocity.y); }
            const verticalCheckPos = robotBox.clone().translate(new THREE.Vector3(0, playerVelocity.y * delta, 0));
            playerOnFloor = false;
            let verticalCollision = false;
            const floorBox = new THREE.Box3().setFromObject(floor);
            if (verticalCheckPos.intersectsBox(floorBox)) {
                if (playerVelocity.y < 0) {
                    playerVelocity.y = 0;
                    robot.position.y = floorBox.max.y;
                    playerOnFloor = true;
                }
                verticalCollision = true;
            }
            if (!verticalCollision) { robot.position.y += playerVelocity.y * delta; }
            robotCollider.updateWorldMatrix(true, false);
            const currentRobotBox = new THREE.Box3().setFromObject(robotCollider);
            const tempRobotBoxX = currentRobotBox.clone().translate(new THREE.Vector3(moveVector.x, 0, 0));
            const tempRobotBoxZ = currentRobotBox.clone().translate(new THREE.Vector3(0, 0, moveVector.z));
            let collisionX = false, collisionZ = false;
            for(const collider of colliders) {
                const colliderBox = new THREE.Box3().setFromObject(collider);
                if(tempRobotBoxX.intersectsBox(colliderBox)) collisionX = true;
                if(tempRobotBoxZ.intersectsBox(colliderBox)) collisionZ = true;
            }
            if(!collisionX) robot.position.x += moveVector.x;
            if(!collisionZ) robot.position.z += moveVector.z;
        }

        function updateRobot(delta) {
            if (!playerOnFloor) { playerVelocity.y -= gravity * delta; }
            
            const cameraForward = new THREE.Vector3();
            camera.getWorldDirection(cameraForward);
            cameraForward.y = 0;
            cameraForward.normalize();

            const cameraRight = new THREE.Vector3();
            cameraRight.crossVectors(cameraForward, new THREE.Vector3(0, 1, 0));
            
            const moveDirection = new THREE.Vector3();
            if (moveForward) moveDirection.add(cameraForward);
            if (moveBackward) moveDirection.sub(cameraForward);
            if (moveLeft) moveDirection.sub(cameraRight); 
            if (moveRight) moveDirection.add(cameraRight);
            
            if (moveDirection.lengthSq() > 0.001) {
                moveDirection.normalize();
                const targetAngle = Math.atan2(moveDirection.x, moveDirection.z);
                const targetQuaternion = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), targetAngle);
                robot.quaternion.slerp(targetQuaternion, 0.2);
            }

            const moveVector = moveDirection.clone().multiplyScalar(playerSpeed * delta);
            handleCollisions(delta, moveVector);

            // --- INTERACTION LOGIC ---
            const pos = robot.position;
            const doorTriggerZ = 4.0; 
            const doorTriggerX = 2.5;
            const isNearDoor = Math.abs(pos.z) < doorTriggerZ && Math.abs(pos.x) < doorTriggerX;

            const tvTriggerMin = new THREE.Vector3(-9, 0, 5);
            const tvTriggerMax = new THREE.Vector3(-4, 5, 11);
            const tvTriggerBox = new THREE.Box3(tvTriggerMin, tvTriggerMax);
            isNearTV = tvTriggerBox.containsPoint(pos);

            const pcTriggerMin = new THREE.Vector3(-4, 0, -12);
            const pcTriggerMax = new THREE.Vector3(2, 5, -8);
            const pcTriggerBox = new THREE.Box3(pcTriggerMin, pcTriggerMax);
            isNearPC = pcTriggerBox.containsPoint(pos);

            if (isCameraAnimating) return;

            if (isNearPC) {
                interactionTooltipElement.textContent = `Press [Enter] to use PC`;
                interactionTooltipElement.style.opacity = '1';
            } else if(isNearTV) {
                 interactionTooltipElement.textContent = `Press [Enter] to use TV`;
                 interactionTooltipElement.style.opacity = '1';
            } else if (isNearDoor) {
                const isInLivingRoom = pos.z > 0;
                const newTooltipText = isInLivingRoom ? "Enter Office" : "Enter Living Room";
                interactionTooltipElement.textContent = `Press [Enter] to ${newTooltipText}`;
                interactionTooltipElement.style.opacity = '1';
            } else {
                interactionTooltipElement.style.opacity = '0';
            }

            if (!isNearTV && tvControlsElement.style.display === 'flex') {
                tvControlsElement.style.display = 'none';
            }
        }

        function updateCamera() {
            cameraTarget.position.copy(robot.position);
            cameraTarget.position.y += 1.5;
            const offset = new THREE.Vector3();
            offset.x = cameraDistance * Math.sin(cameraPhi) * Math.sin(cameraTheta);
            offset.y = cameraDistance * Math.cos(cameraPhi);
            offset.z = cameraDistance * Math.sin(cameraPhi) * Math.cos(cameraTheta);
            const cameraPosition = cameraTarget.position.clone().add(offset);
            const raycaster = new THREE.Raycaster(cameraTarget.position, cameraPosition.clone().sub(cameraTarget.position).normalize());
           
            const cameraBlockers = [...colliders, floor];
            const intersects = raycaster.intersectObjects(cameraBlockers, true);
            if (intersects.length > 0 && intersects[0].distance < cameraDistance) {
                camera.position.lerp(intersects[0].point, 0.2);
            } else {
                camera.position.lerp(cameraPosition, 0.1);
            }
            camera.lookAt(cameraTarget.position);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            
            if (!isUsingPC && !isTeleporting && !isCameraAnimating && robot) { 
                updateRobot(delta); 
                updateCamera(); 
            }

            if (tvVideoElement && tvVideoElement.readyState >= tvVideoElement.HAVE_CURRENT_DATA) { tvVideoTexture.needsUpdate = true; }
            if (tvLoadingCanvas && tvLoadingCtx && tvLoadingTexture && tvLoadingMesh && (tvLoadingActive || tvLoadingMesh.material.opacity > 0)) {
                const ctx = tvLoadingCtx; const w = tvLoadingCanvas.width, h = tvLoadingCanvas.height; ctx.clearRect(0, 0, w, h); const t = performance.now() * 0.001; const g = ctx.createLinearGradient(0, 0, 0, h); const baseA = 16 + Math.floor(8 * Math.sin(t * 2)); g.addColorStop(0, `rgba(${30 + baseA},${12 + baseA},${40 + baseA},1)`); g.addColorStop(1, `rgba(${8 + baseA},${6 + baseA},${18 + baseA},1)`); ctx.fillStyle = g; ctx.fillRect(0, 0, w, h); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = 'rgba(255,255,255,0.02)'; for (let i = 0; i < 24; i++) { const yy = ((i / 24) * h) + (Math.sin(t * 3 + i) * 4); ctx.fillRect(0, yy, w, 1.2); } ctx.globalCompositeOperation = 'source-over'; const cx = w * 0.5, cy = h * 0.5, r = Math.min(w, h) * 0.12; ctx.beginPath(); ctx.strokeStyle = 'rgba(200,240,255,0.95)'; ctx.lineWidth = Math.max(2, w * 0.008); ctx.arc(cx, cy, r, t * 2, t * 2 + Math.PI * 1.5); ctx.stroke(); ctx.beginPath(); ctx.fillStyle = `rgba(100,220,255,${0.5 + 0.5 * Math.sin(t * 6)})`; ctx.arc(cx, cy, Math.max(2, w * 0.005) + 2 * Math.abs(Math.sin(t * 3)), 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = 'rgba(180,220,255,0.9)'; ctx.font = `${Math.max(12, Math.round(w * 0.03))}px monospace`; ctx.textAlign = 'center'; ctx.fillText('LOADING • 3D CHANNEL', cx, h - 26); tvLoadingTexture.needsUpdate = true;
                if (!tvLoadingActive) { tvLoadingMesh.material.opacity = Math.max(0, tvLoadingMesh.material.opacity - TV_LOADING_FADE_SPEED); if (tvLoadingMesh.material.opacity <= 0.001) tvLoadingMesh.visible = false; }
            }
            if (cityCtx) {
                cityCtx.drawImage(bgCanvas, 0, 0); cityCtx.fillStyle = 'rgba(255, 255, 255, 0.9)'; cityCtx.beginPath();
                for (const flake of snowflakes) { flake.y += flake.speed; if (flake.y > cityCanvas.height) { flake.y = -5; flake.x = Math.random() * cityCanvas.width; } cityCtx.moveTo(flake.x, flake.y); cityCtx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2); }
                cityCtx.fill(); cityTexture.needsUpdate = true;
            }
            composer.render();
        }

        init();
        // Animate is now called by the loading manager once everything is ready
    </script>
</body>
</html>
