<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Programmer's Apartment</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <!-- Splash Screen -->
    <div id="splashScreen">
        <h1>Welcome to My Virtual Space🏠</h1>
        <div id="loadingBarContainer">
            <div id="loadingBar"></div>
        </div>
    </div>

    <div id="mobileWelcomeScreen">
        <div class="mobile-content">
            <h1>Welcome!</h1>
            <p>For the best immersive 3D experience, please use a desktop device.</p>
            <div class="separator">OR</div>
            <a href="https://ashishwaikar.netlify.app" class="portfolio-button">Continue to 2D Portfolio</a>
        </div>
    </div>
    
    <!-- Hidden video element for the TV texture -->
    <video id="tvVideo" autoplay loop muted playsinline crossorigin="anonymous">
        <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <!-- UI Elements -->
    <div id="info" style="display: none;">Click to Start, then W, A, S, D to Move & Mouse to Look  (refresh if page is blank)</div>
    <div id="interactionTooltip">Press [Enter] to Interact</div>
    <div id="fadeOverlay"></div>
    <div id="tvControls">
        <button id="tvPrev" title="Previous Video">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"></path></svg>
        </button>
        <button id="tvPlayPause" title="Play/Pause">
            <svg id="tvIconPlay" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" style="display: none;"><path d="M8 5v14l11-7z"></path></svg>
            <svg id="tvIconPause" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path></svg>
        </button>
        <button id="tvMute" title="Mute/Unmute">
            <svg id="tvIconUnmute" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"></path></svg>
            <svg id="tvIconMute" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" style="display: none;"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"></path></svg>
        </button>
        <button id="tvNext" title="Next Video">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zm-4.5 6-8.5 6V6z"></path></svg>
        </button>
    </div>
    <div id="websiteContainer">
        <iframe id="websiteFrame" 
        src="about:blank"
          sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-modals allow-top-navigation-by-user-activation"
          style="position:absolute;border:2px solid #000;background:#000;width:1280px;height:695px;transform-origin:center center;will-change:transform,left,top;"></iframe>
        <div id="exitTooltip">Click outside the screen and Press [Esc] to Exit</div>
    </div>


    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/",
                 "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/index.js"
            }
        }
    </script>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
